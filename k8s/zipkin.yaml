apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.6.1
          ports:
            - containerPort: 9411
          env:
            - { name: JAVA_OPTS, value: "-Xmx256m" }
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
