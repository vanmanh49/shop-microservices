apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: shop/config-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx256m" }
          # Up to five minutes to start; a service that comes up before its
          # dependencies exits and is restarted.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8888 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8888 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8888 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
