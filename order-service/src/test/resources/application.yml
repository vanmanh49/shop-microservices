spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  kafka:
    admin:
      auto-create: false
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      enabled: false

shop:
  clients:
    product:
      base-url: http://product-service
    inventory:
      base-url: http://inventory-service
  kafka:
    order-events-topic: order-events
