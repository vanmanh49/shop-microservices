spring:
  application:
    name: product-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      enabled: false
