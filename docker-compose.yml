name: shop

# Settings shared by every Spring Boot container.
x-app: &app
  restart: unless-stopped
  networks: [shop]

x-app-env: &app-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  DB_HOST: postgres
  DB_USER: shop
  DB_PASSWORD: shop
  KAFKA_BOOTSTRAP: kafka:9092
  AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  # Development credentials. Change them before exposing this anywhere.
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin12345
  JAVA_TOOL_OPTIONS: -Xmx256m

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  # --- Infrastructure -------------------------------------------------------

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [shop]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single node acting as both broker and controller (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks: [shop]

  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports: ["9411:9411"]
    networks: [shop]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [shop]

  # --- Platform services ----------------------------------------------------

  discovery-server:
    <<: *app
    build: { context: ., args: { MODULE: discovery-server } }
    environment: { JAVA_TOOL_OPTIONS: -Xmx256m }
    ports: ["8761:8761"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health > /dev/null"]

  config-server:
    <<: *app
    build: { context: ., args: { MODULE: config-server } }
    environment: { JAVA_TOOL_OPTIONS: -Xmx256m }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health > /dev/null"]

  # --- Business services ----------------------------------------------------
  # None of these publish a port: the gateway is the only way in.

  auth-service:
    <<: *app
    build: { context: ., args: { MODULE: auth-service } }
    environment: *app-env
    depends_on: &service-deps
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health > /dev/null"]

  product-service:
    <<: *app
    build: { context: ., args: { MODULE: product-service } }
    environment: *app-env
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health > /dev/null"]

  inventory-service:
    <<: *app
    build: { context: ., args: { MODULE: inventory-service } }
    environment: *app-env
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health > /dev/null"]

  order-service:
    <<: *app
    build: { context: ., args: { MODULE: order-service } }
    environment: *app-env
    depends_on: &messaging-deps
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health > /dev/null"]

  notification-service:
    <<: *app
    build: { context: ., args: { MODULE: notification-service } }
    environment: *app-env
    depends_on: *messaging-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health > /dev/null"]

  # --- Edge -----------------------------------------------------------------

  api-gateway:
    <<: *app
    build: { context: ., args: { MODULE: api-gateway } }
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null"]

networks:
  shop:

volumes:
  postgres-data:
