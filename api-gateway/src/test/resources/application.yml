spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      enabled: false
