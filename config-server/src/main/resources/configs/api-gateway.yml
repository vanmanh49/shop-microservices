server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  http:
    clients:
      connect-timeout: 2s
      # Longer than order-service's slowest path (product call 3s, reservation 3s, release
      # 3s, Kafka send up to 5s): if the gateway gave up first, the client would see 503
      # for an order that was placed, and a retry would place it twice.
      read-timeout: 20s
  cloud:
    circuitbreaker:
      resilience4j:
        # The HTTP client timeouts above bound each proxied call.
        disable-time-limiter: true
        # Run calls on the caller's thread: a separate pool would lose the trace context.
        disable-thread-pool: true
