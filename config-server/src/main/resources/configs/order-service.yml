server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orderdb
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s
  cloud:
    circuitbreaker:
      resilience4j:
        # The HTTP client timeouts above bound each call.
        disable-time-limiter: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # 4xx responses are business outcomes, not dependency failures.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

shop:
  clients:
    product:
      base-url: http://product-service
    inventory:
      base-url: http://inventory-service
  kafka:
    order-events-topic: order-events
