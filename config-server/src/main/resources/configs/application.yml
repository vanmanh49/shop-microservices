# Shared by every service that imports configuration from the config server.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # How often a service refreshes its copy of the registry (default 30s). Kept short so
    # a newly started service becomes reachable quickly; costs more registry traffic.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

spring:
  cloud:
    loadbalancer:
      cache:
        # How long a client reuses a resolved list of instances (default 35s).
        ttl: 5s
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
